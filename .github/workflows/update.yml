name: 更新最新新闻

on:
  schedule:
    - cron: "17 */3 * * *" # 每 3 小时一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_readme.py
      - name: 有变化就提交
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "aiguanchao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "更新最新新闻 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
